import org.gradle.buildconfiguration.tasks.UpdateDaemonJvm

import java.util.regex.Matcher
import java.util.regex.Pattern

abstract class SdkmanValueSource implements ValueSource<JavaLanguageVersion, Parameters> {

    interface Parameters extends ValueSourceParameters {
        @InputFile
        RegularFileProperty getFile()
    }

    static final String FILE_NAME = ".sdkmanrc"

    @Override
    JavaLanguageVersion obtain() {
        Properties prop = new Properties()
        def file = parameters.getFile().asFile.getOrNull()
        if (file == null || !file.exists()) {
            throw new GradleException("Could not find .sdkmanrc file at ${file}.")
        }
        file.withInputStream { prop.load(it) }
        String javaVersion = prop.getProperty("java")
        if (javaVersion == null || javaVersion.trim().isEmpty()) {
            throw new GradleException("Could not find 'java' entry in .sdkmanrc file: ${file}.")
        }
        Matcher matcher = Pattern.compile("^(\\d+)\\.(\\d+)\\.(\\d+)-([A-Za-z0-9._-]+)\$").matcher(javaVersion)
        String major = matcher.matches() ? matcher.group(1) : null
        if (major == null) {
            throw new GradleException("Could not parse Java version from .sdkmanrc file: ${javaVersion}")
        }
        return JavaLanguageVersion.of(major)
    }
}

tasks.withType(UpdateDaemonJvm).configureEach {
    languageVersion.set(providers.of(SdkmanValueSource) { parameters.file.set(layout.settingsDirectory.file(SdkmanValueSource.FILE_NAME)) })
    vendor.set(JvmVendorSpec.ADOPTIUM)
    // workaround: https://github.com/gradle/gradle/issues/37507
    toolchainDownloadUrls.set(toolchainDownloadUrls.get())
}
