pluginManager.apply("com.vanniktech.maven.publish")
pluginManager.apply("signing")

abstract class LocalDotPropertiesValueSource implements ValueSource<Properties, Parameters> {
    interface Parameters extends ValueSourceParameters {
        @InputFiles
        RegularFileProperty getFile()
    }

    Properties obtain() {
        def prop = new Properties()
        def file = parameters.file.get().asFile
        if (file.exists()) {
            prop.load(file.newReader())
        }
        return prop
    }
}

def propertiesProvider = providers.of(LocalDotPropertiesValueSource.class) {
    parameters {
        file = project.layout.settingsDirectory.file(".local.properties")
    }
}

