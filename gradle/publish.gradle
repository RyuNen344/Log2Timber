signing {
    def enabled = propertiesProvider.get().getProperty("signing.enabled")?.toBoolean() ?: providers.environmentVariable("SIGNING_ENABLED").map { it == "true" }.getOrElse(false)
    if (enabled) {
        def keyId = propertiesProvider.get().getProperty("pgp.key_id") ?: providers.environmentVariable("PGP_KEY_ID").getOrNull()
        def secretKey = propertiesProvider.get().getProperty("pgp.signing_key") ?: providers.environmentVariable("PGP_SIGNING_KEY").getOrNull()
        def password = propertiesProvider.get().getProperty("pgp.signing_password") ?: providers.environmentVariable("PGP_SIGNING_PASSWORD").getOrNull()
        useInMemoryPgpKeys(keyId, secretKey, password)
        sign(publishing.publications)
    }
}
